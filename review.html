<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insect Atlas · 이미지 검수</title>
  <style>
    :root { color-scheme:dark; font-family:Inter,Pretendard,system-ui,sans-serif; background:#0a100c; color:#f0f7ee; --line:#304331; --muted:#a4b5a3; --accent:#a8e697; }
    * { box-sizing:border-box; } body { margin:0; padding:24px; background:radial-gradient(circle at 8% 0,#2d582d55,transparent 32rem),#0a100c; }
    h1,h2,p { margin-top:0; } .lede { color:var(--muted); max-width:780px; line-height:1.6; }
    .bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:18px 0; padding:12px; border:1px solid var(--line); border-radius:12px; background:#121c13; }
    button,select { font:inherit; color:inherit; border:1px solid var(--line); border-radius:9px; background:#1a291a; padding:8px 10px; cursor:pointer; } button.active { background:var(--accent); border-color:var(--accent); color:#10200f; font-weight:800; } button.pass { border-color:#79c96b; } button.hold { border-color:#e0bf6c; } button.reject { border-color:#df7777; }
    #summary { margin-left:auto; color:var(--muted); } .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
    article { overflow:hidden; border:1px solid var(--line); border-radius:13px; background:#121a13; } img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:#070b07; cursor:zoom-in; }
    .copy { padding:12px; } .copy h2 { margin-bottom:5px; font-size:1.02rem; } .meta { color:var(--muted); font-size:.79rem; line-height:1.45; } .controls { display:flex; gap:6px; margin-top:11px; } .controls button { flex:1; padding:7px 5px; font-size:.78rem; }
    .status { display:inline-block; margin-top:7px; padding:3px 7px; border-radius:999px; background:#263427; color:#d4ead0; font-size:.74rem; } .status.pass { background:#24542a; }.status.reject { background:#5a2828; }.status.hold { background:#57491e; }
    dialog { width:min(1100px,96vw); border:1px solid var(--line); border-radius:16px; padding:0; background:#101711; color:inherit; } dialog::backdrop { background:#000c; } dialog img { width:100%; max-height:78vh; object-fit:contain; cursor:default; } dialog section { padding:14px 16px; } dialog button { float:right; }
    @media (max-width:600px) { body { padding:14px; } #summary { width:100%; margin-left:0; } }
  </style>
</head>
<body>
  <h1>Insect Atlas · 전체 이미지 검수</h1>
  <p class="lede">생성 테스트, 형태·정보 참고, 생태, 상호작용 후보를 한 번에 봅니다. 모든 자산은 review 전용이며, 통과·보류·탈락 선택은 이 Chrome의 검수 세션에 저장됩니다. 승인 경로와 본 사이트 갤러리는 이 화면만으로 변경되지 않습니다.</p>
  <section class="bar" aria-label="검수 필터">
    <button class="active" data-filter="all">전체</button><button data-filter="morphology">형태·정보</button><button data-filter="ecology">생태</button><button data-filter="interaction">상호작용</button><button data-filter="test">생성 테스트</button>
    <select id="decisionFilter" aria-label="판정 필터"><option value="all">모든 판정</option><option value="pending">보류</option><option value="pass">통과</option><option value="reject">탈락</option></select>
    <span id="summary">불러오는 중…</span>
  </section>
  <main id="grid" class="grid" aria-live="polite"></main>
  <dialog id="viewer"><button id="closeViewer" aria-label="큰 보기 닫기">×</button><img id="viewerImage" alt=""><section><strong id="viewerTitle"></strong><p id="viewerMeta" class="meta"></p></section></dialog>
  <script type="module" src="./review.js"></script>
</body>
</html>
